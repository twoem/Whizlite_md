<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      JawadTechX - WhatsApp Pair
    </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <i class="fas fa-robot"></i>
        </div>
        <h1 class="title">
          JawadTechX
        </h1>
        <p class="subtitle">
          Connect your WhatsApp account
        </p>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="pair">
            Pair Code
          </button>
          <button class="mode-btn" data-mode="qr">
            QR Code
          </button>
        </div>
        <div class="social-icons">
          <a href="https://www.youtube.com/@JawadTechX" target="_blank" class="youtube">          <i class="fab fa-youtube"></i>
</a>
          <a href="https://github.com/JawadYT36/KHAN-MD" target="_blank" class="telegram">          <i class="fab fa-github"></i>
</a>
          <a href="https://whatsapp.com/channel/0029VatOy2EAzNc2WcShQw1j" target="_blank" class="whatsapp">          <i class="fab fa-whatsapp"></i>
</a>
          <a href="https://github.com/JawadTechXD/JAWAD-MD" target="_blank" class="github">          <i class="fab fa-github"></i>
</a>
        </div>
      </div>
      <!-- Pair Code Section -->
      <div class="content-section active" id="pair-section">
        <div class="input-group">
          <label class="input-label">
            Enter your WhatsApp number with country code
          </label>
          <input type="tel" id="mobileNumber" class="input-field" placeholder="923427582273" pattern="[0-9]{8,}" title="Please enter your full phone number including country code" />
          <p style="font-size: 12px; color: var(--secondary-color); margin-top: 5px;">
            Example: 923427582273 (92 for Pakistan)
          </p>
        </div>
        <button class="generate-btn" id="submit">
          <i class="fas fa-key"></i>
          Generate Pair Code
        </button>
        <div class="loading" id="loading">
          <i class="fas fa-spinner"></i>
        </div>
        <div class="code-display" id="codeDisplay">
          Your pair code will appear here
        </div>
        <button class="copy-btn" id="copy" onclick="copyCode()">
          <i class="fas fa-copy"></i>
          Copy Code
        </button>
      </div>
      <!-- QR Code Section -->
      <div class="content-section" id="qr-section">
        <div class="qr-container">
          <div class="qr-image-container">
            <img id="qr-image" src="/server" alt="QR CODE" class="qr-image" />
            <div class="qr-loading" id="qrLoading">
              <i class="fas fa-spinner"></i>
            </div>
          </div>
          <div class="qr-timer">
            <p>
              Scan the QR code within
              <span id="time-left">              30
</span>
              seconds
            </p>
            <progress value="0" max="30" id="progressBar">
            </progress>
          </div>
          <button class="reload-button" id="reloadQR">
            <i class="fas fa-sync-alt"></i>
            Regenerate QR Code
          </button>
        </div>
      </div>
      <div class="footer">
        <p>
          © 2025 JAWAD TECH | KHAN-MD
        </p>
      </div>
    </div>
    <!-- Toast -->
    <div id="toast">
      Code Copied
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js">
    </script>
    <script src="script.js">
    </script>
  </body>
</html>
